services:
  postgres:
    image: postgres:16
    container_name: crediya-postgres
    environment:
      POSTGRES_DB: crediya_db
      POSTGRES_USER: ${DB_USERNAME:-crediya}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define la variable DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - crediya-pgdata:/var/lib/postgresql/data

volumes:
  crediya-pgdata:
